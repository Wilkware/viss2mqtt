# viss2mqtt – eigene MQTT-Einstellungen
#
# Als /opt/viss2mqtt/local/viss2mqtt.ini ablegen und nur für den eigenen
# Benutzer lesbar machen (enthält das Passwort):
#   mkdir -p /opt/viss2mqtt/local
#   cp /opt/viss2mqtt/examples/viss2mqtt.ini /opt/viss2mqtt/local/
#   chmod 600 /opt/viss2mqtt/local/viss2mqtt.ini
#
# Gilt für beide Läufe. Fehlende Einträge behalten ihren Standardwert,
# leere Werte für user/password bedeuten: ohne Anmeldung.

[mqtt]
host = 192.168.13.3
port = 1883
user =
password =
topic = viss2mqtt/vito
